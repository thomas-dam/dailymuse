name: DailyMuse
options:
  bundleIdPrefix: com.thomasdam
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  DailyMuse:
    type: application
    platform: macOS
    sources:
      - path: DailyMuse
        excludes:
          - README.md
    info:
      path: DailyMuse/Info.plist
      properties:
        CFBundleDisplayName: DailyMuse
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        LSUIElement: true
        NSHighResolutionCapable: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thomasdam.DailyMuse
        PRODUCT_NAME: DailyMuse
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
  DailyMuseTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: DailyMuseTests
    dependencies:
      - target: DailyMuse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thomasdam.DailyMuseTests
